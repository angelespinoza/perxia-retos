<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro como Proveedor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="barra">
    <div>
      <h1>Registro como Proveedor</h1>
      <p class="sub">Agente de Periferia IT Group · prepara formularios y paquetes para firma</p>
    </div>
    <div class="acciones">
      <span id="modelo" class="insignia">…</span>
      <span id="usuario" class="insignia" hidden></span>
      <button id="nueva" class="secundario" type="button">Nueva sesión</button>
      <form class="salir" method="post" action="/logout">
        <button class="secundario" type="submit">Cerrar sesión</button>
      </form>
    </div>
  </header>

  <main class="layout">
    <section class="chat" aria-label="Conversación">
      <div id="mensajes" class="mensajes" aria-live="polite">
        <div class="bienvenida">
          <p>Pídeme que procese una solicitud. Por ejemplo:</p>
          <div class="sugerencias">
            <button type="button" data-texto="¿Qué casos hay pendientes?">¿Qué casos hay pendientes?</button>
            <button type="button" data-texto='Procesa el caso "ec-corp-andina". Dime qué campos quedaron llenos, cuáles faltan, si el paquete está listo para firma y qué soportes debo actualizar. No envíes nada todavía.'>Procesar ec-corp-andina</button>
            <button type="button" data-texto='Procesa el caso "co-industrias-delta".'>Procesar co-industrias-delta</button>
            <button type="button" data-texto='Procesa el caso "hn-agroexport-sula".'>Procesar hn-agroexport-sula</button>
            <button type="button" data-texto='Procesa el caso "pa-logistica-istmo".'>Procesar pa-logistica-istmo</button>
          </div>
        </div>
      </div>

      <div id="confirmacion" class="confirmacion" hidden>
        <div>
          <strong>El agente pide confirmación</strong>
          <p id="confirmacion-texto"></p>
          <p id="confirmacion-advertencia" class="advertencia" hidden></p>
        </div>
        <div class="botones">
          <button id="confirmar" type="button">Confirmar</button>
          <button id="cancelar" class="secundario" type="button">Cancelar</button>
        </div>
      </div>

      <form id="formulario" class="entrada">
        <textarea id="texto" rows="2" placeholder="Escribe un mensaje… (Enter para enviar, Shift+Enter para salto de línea)" required></textarea>
        <button id="enviar" type="submit">Enviar</button>
      </form>
    </section>

    <aside class="panel" aria-label="Archivos generados">
      <h2>Archivos generados</h2>
      <p class="sub" id="panel-caso">Aparecen al procesar un caso.</p>
      <ul id="archivos"></ul>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
