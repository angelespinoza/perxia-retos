<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso · Registro como Proveedor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="barra">
    <div>
      <h1>Registro como Proveedor</h1>
      <p class="sub">Agente de Periferia IT Group · prepara formularios y paquetes para firma</p>
    </div>
  </header>

  <main class="ingreso">
    <form class="tarjeta-ingreso" method="post" action="/login">
      <div>
        <h2>Ingresar</h2>
        <p class="sub">Usa el usuario y la contraseña de acceso de la demo.</p>
      </div>
      <!--MENSAJE-->
      <label>Usuario
        <input name="usuario" autocomplete="username" required autofocus>
      </label>
      <label>Contraseña
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Ingresar</button>
    </form>
  </main>
</body>
</html>
